<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교회 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 도트 게임 화면. 지도는 작은 캔버스에 그리고 CSS 로 키운다(image-rendering: pixelated). */
:root {
  --ink: #101a24; --panel: rgba(16, 26, 36, .9); --line: rgba(246, 240, 228, .25);
  --paper: #f6f0e4; --muted: #b9c0c6; --brass: #e0ad4e; --brass-ink: #2a1c05;
  --font-display: "Gowun Batang", serif; --font-body: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font-family: var(--font-body); overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#screen { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #20242b; }
#cv { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; image-rendering: crisp-edges; transition: opacity .25s; }
#cv.fade { opacity: 0; }

#hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  background: linear-gradient(rgba(16,26,36,.85), rgba(16,26,36,0)); pointer-events: none; }
#hud > * { pointer-events: auto; }
#place small { display: block; color: var(--muted); font-size: 12px; }
#place b { font-family: var(--font-display); font-size: 19px; }
#hudBtns { display: flex; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px; font-size: 14px; white-space: nowrap; }
.pill.on, .primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 700; }
.icon { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; }
.icon svg { width: 18px; height: 18px; }
#quest { position: absolute; left: 12px; right: 12px; top: 62px; margin: auto; width: fit-content; max-width: calc(100% - 24px);
  background: var(--panel); border: 1px solid var(--brass); border-radius: 10px; padding: 6px 12px; font-size: 14px; text-align: center; }
#quest b { color: var(--brass); margin-right: 6px; }

/* 대화창: 게임기 느낌의 두꺼운 테두리 */
#dialog { position: absolute; left: 10px; right: 10px; bottom: 10px; min-height: 92px; background: #fbf7ee; color: #2b2418;
  border: 4px solid #2b2418; border-radius: 10px; box-shadow: inset 0 0 0 3px #fbf7ee, inset 0 0 0 5px #c9b48a; padding: 12px 16px 14px; cursor: pointer; }
#dName { position: absolute; top: -16px; left: 12px; background: #2b2418; color: #fbf7ee; border-radius: 6px; padding: 2px 10px; font-size: 13px; }
#dName:empty { display: none; }
#dText { margin: 0; font-size: 17px; line-height: 1.55; white-space: pre-line; min-height: 52px; }
#dMore { position: absolute; right: 12px; bottom: 6px; font-size: 12px; animation: bob .6s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(3px); } }

#menu { position: absolute; right: 10px; bottom: 10px; background: #fbf7ee; color: #2b2418; border: 4px solid #2b2418; border-radius: 10px;
  padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 170px; }
#menu p { margin: 0 4px 4px; font-size: 14px; color: #6b5a3a; }
#menu button { border: 0; background: none; text-align: left; padding: 8px 10px 8px 26px; border-radius: 6px; font-size: 17px; position: relative; }
#menu button.sel, #menu button:hover { background: #efe3c4; }
#menu button.sel::before { content: "▶"; position: absolute; left: 8px; font-size: 12px; top: 12px; }

#bag { position: absolute; right: 10px; top: 104px; background: #fbf7ee; color: #2b2418; border: 4px solid #2b2418; border-radius: 10px;
  padding: 10px 12px; width: min(300px, calc(100% - 20px)); display: flex; flex-direction: column; gap: 6px; }
#bag h3 { margin: 0; font-size: 15px; }
#bag button.item { border: 0; background: #efe3c4; border-radius: 8px; padding: 8px 10px; text-align: left; color: #2b2418; display: flex; gap: 10px; align-items: center; }
.ico { image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }
#toast .ico { display: block; margin: 0 auto 6px; }
#menu button.soon { color: #8a7a5a; }
#bag button.item b { display: block; font-size: 15px; }
#bag button.item small { color: #6b5a3a; }
#bag p { margin: 0; color: #6b5a3a; font-size: 14px; }
#emotes { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 20px); }
#emotes button { font-size: 13px; padding: 6px 10px; }
#ticket { background: var(--paper); color: #2b2418; border-radius: 14px; padding: 18px; border: 2px dashed #b89a5e; display: flex; flex-direction: column; gap: 4px; }
#ticket small { color: #7b6a48; }
#ticket b { font-family: var(--font-display); font-size: 28px; }
#toast { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--brass);
  border-radius: 12px; padding: 10px 18px; font-size: 16px; text-align: center; pointer-events: none; }

/* 조작 패드 */
#pad { flex: none; height: 196px; padding: 14px 22px calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between;
  background: #1a222c; border-top: 1px solid var(--line); touch-action: none; }
#dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); }
#dpad button { border: 0; background: #34404d; color: var(--paper); font-size: 20px; touch-action: none; }
#dpad button.down { background: #4d5d6e; }
#dpad [data-d="up"] { grid-area: 1 / 2; border-radius: 10px 10px 0 0; }
#dpad [data-d="left"] { grid-area: 2 / 1; border-radius: 10px 0 0 10px; }
#dpad [data-d="right"] { grid-area: 2 / 3; border-radius: 0 10px 10px 0; }
#dpad [data-d="down"] { grid-area: 3 / 2; border-radius: 0 0 10px 10px; }
#dpad i { grid-area: 2 / 2; background: #34404d; }
#abtn { width: 78px; height: 78px; border-radius: 50%; border: 0; background: var(--brass); color: var(--brass-ink); font-size: 24px; font-weight: 700;
  box-shadow: 0 5px 0 #a87a2a; touch-action: none; }
#abtn.down { transform: translateY(4px); box-shadow: 0 1px 0 #a87a2a; }
#keysHint { color: var(--muted); font-size: 12px; text-align: center; flex: 1; padding: 0 10px; }

/* 첫 화면, 초대장, 투어 창 */
.veil { position: fixed; inset: 0; background: rgba(8, 13, 19, .7); display: flex; align-items: center; justify-content: center; padding: 16px; }
.card { width: min(420px, 100%); background: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; text-align: center;
  display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.card h1 { margin: 0; font-family: var(--font-display); font-size: clamp(28px, 8vw, 40px); line-height: 1.2; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 24px; }
.card p { margin: 0; }
.card .sub { color: var(--muted); }
.big { border: 0; border-radius: 12px; padding: 14px; font-size: 17px; text-decoration: none; display: block; }
.card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.card a.link { color: var(--muted); font-size: 14px; }
#title canvas { image-rendering: pixelated; width: 96px; height: 96px; margin: 0 auto; }
#overlay { position: fixed; inset: 0; background: var(--ink); }
#overlay iframe { width: 100%; height: 100%; border: 0; display: block; }
#overlay .back { position: absolute; left: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 2; }
@media (prefers-reduced-motion: reduce) { #dMore { animation: none; } #cv { transition: none; } }
</style>
</head>
<body>

<div id="app">
  <div id="screen">
    <canvas id="cv" aria-label="교회 지도. 방향 버튼으로 걸어 다닐 수 있습니다."></canvas>
    <div id="hud">
      <div id="place"><small id="church"></small><b id="area"></b></div>
      <div id="hudBtns">
        <button class="pill" id="photoBtn" type="button">사진으로 보기</button>
        <button class="pill" id="bagBtn" type="button">가방</button>
        <button class="pill icon" id="soundBtn" type="button"></button>
      </div>
    </div>
    <div id="quest" aria-live="polite"></div>
    <div id="toast" hidden></div>
    <div id="dialog" hidden role="dialog" aria-live="polite"><span id="dName"></span><p id="dText"></p><span id="dMore">▼</span></div>
    <div id="menu" hidden role="menu"></div>
    <div id="bag" hidden role="dialog" aria-label="가방"></div>
    <div id="emotes" hidden aria-label="인사하기"></div>
  </div>
  <div id="pad">
    <div id="dpad" aria-label="방향">
      <button type="button" data-d="up" aria-label="위">▲</button>
      <button type="button" data-d="left" aria-label="왼쪽">◀</button>
      <i></i>
      <button type="button" data-d="right" aria-label="오른쪽">▶</button>
      <button type="button" data-d="down" aria-label="아래">▼</button>
    </div>
    <div id="keysHint">사람이나 악기 앞에서<br>A 를 누르세요</div>
    <button id="abtn" type="button" aria-label="말 걸기, 살펴보기">A</button>
  </div>
</div>

<div class="veil" id="title">
  <div class="card">
    <canvas id="titleArt" width="16" height="16"></canvas>
    <h1 id="tTitle"></h1>
    <p class="sub" id="tSub"></p>
    <button class="pill" id="lookBtn" type="button">모습 바꾸기</button>
    <button class="big primary" id="startBtn" type="button">시작하기</button>
    <button class="big pill" id="newBtn" type="button" hidden>처음부터 하기</button>
    <a class="link" href="index.html">360도 사진 투어로 보기</a>
  </div>
</div>

<div class="veil" id="inviteV" hidden>
  <div class="card" role="dialog" aria-labelledby="ivT">
    <h2 id="ivT"></h2>
    <ul id="ivLines"></ul>
    <p class="sub" id="ivNote"></p>
    <div id="ticket" hidden><small id="tkTitle">음료 교환권</small><b id="tkDrink"></b><span id="tkChurch"></span><small id="tkNote"></small></div>
    <a class="big primary" id="ivMap" target="_blank" rel="noopener" hidden>지도 보기</a>
    <button class="big pill" id="ivClose" type="button">닫기</button>
  </div>
</div>

<div id="overlay" hidden>
  <iframe id="frame" title="교회 사진과 연주 화면"></iframe>
  <button class="pill primary back" id="backBtn" type="button">← 게임으로 돌아가기</button>
</div>

<script src="config.js"></script>
<script>
(function () {
"use strict";
var T = window.TOUR, G = T && T.game;
var $ = function (id) { return document.getElementById(id); };
if (!G) { document.body.textContent = "config.js 에 game 설정이 없습니다. README 의 '도트 게임 모드'를 참고해 주세요."; return; }
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var TS = 16;
var DX = { up: 0, down: 0, left: -1, right: 1 }, DY = { up: -1, down: 1, left: 0, right: 0 };
var BACK = { up: "down", down: "up", left: "right", right: "left" };

/* ---------- 그림: 바닥과 벽 (한 칸 16x16, 코드로 그림) ---------- */
function paint(fn) {
  var c = document.createElement("canvas"); c.width = c.height = TS;
  var g = c.getContext("2d");
  fn(function (x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }, g);
  return c;
}
function floor(R) { R(0, 0, 16, 16, "#dcd6c8"); R(0, 15, 16, 1, "#cdc6b5"); R(15, 0, 1, 16, "#cdc6b5"); }
function wood(R) { R(0, 0, 16, 16, "#c9a271"); [0, 4, 8, 12].forEach(function (y, i) { R(0, y + 3, 16, 1, "#b48d5c"); R((i * 6 + 3) % 16, y, 1, 3, "#b48d5c"); }); }
function wall(R) { R(0, 0, 16, 16, "#efe6d4"); R(0, 0, 16, 3, "#a2937b"); R(0, 13, 16, 3, "#d6c9b0"); }
var TILE = {
  ".": floor,
  ",": wood,
  "_": function (R) { R(0, 0, 16, 16, "#e6bcac"); R(0, 15, 16, 1, "#d3a594"); R(15, 0, 1, 16, "#d3a594"); },
  "#": wall,
  "w": function (R) { wall(R); R(3, 4, 10, 8, "#cfe6f2"); R(3, 4, 3, 8, "#f7f7f7"); R(10, 4, 3, 8, "#f7f7f7"); R(3, 11, 10, 1, "#b9a98d"); },
  "x": function (R) { wall(R); R(5, 4, 6, 10, "#ffe6a8"); R(7, 4, 2, 10, "#8a5a33"); R(5, 7, 6, 2, "#8a5a33"); },
  "b": function (R) {
    R(0, 0, 16, 16, "#6b4a2b"); R(1, 1, 14, 6, "#3a2717"); R(1, 9, 14, 6, "#3a2717");
    var cs = ["#c0392b", "#2f6f9f", "#e0ad4e", "#4f8a3c", "#8e5ea2", "#ecf0f1"];
    for (var i = 0; i < 7; i++) { R(1 + i * 2, 2 + (i % 2), 2, 5 - (i % 2), cs[i % 6]); R(1 + i * 2, 10 + ((i + 1) % 2), 2, 5 - ((i + 1) % 2), cs[(i + 3) % 6]); }
  },
  "h": function (R) { floor(R); R(0, 4, 16, 9, "#8a5a33"); R(0, 4, 16, 3, "#6b4426"); R(0, 12, 16, 1, "#5a381f"); },
  "t": function (R) { wood(R); R(1, 2, 14, 12, "#9c6a3c"); R(1, 12, 14, 2, "#7a4f2a"); R(2, 3, 12, 1, "#b88250"); },
  "c": function (R) { wood(R); R(4, 3, 8, 3, "#a9b43d"); R(4, 6, 8, 6, "#c8d455"); R(4, 12, 1, 3, "#555"); R(11, 12, 1, 3, "#555"); },
  "k": function (R) { wood(R); R(0, 3, 16, 13, "#2f333a"); R(0, 3, 16, 3, "#5b616b"); R(0, 15, 16, 1, "#1d2025"); },
  "p": function (R) { floor(R); R(5, 11, 6, 5, "#a0522d"); R(3, 3, 10, 9, "#4f8a3c"); R(5, 1, 6, 4, "#5fa04a"); R(2, 6, 3, 4, "#3f7330"); R(11, 5, 3, 4, "#3f7330"); },
  "g": function (R) { floor(R); R(2, 0, 12, 16, "rgba(150,210,230,.55)"); R(0, 0, 2, 16, "#8fa9b6"); R(14, 0, 2, 16, "#8fa9b6"); R(7, 6, 2, 5, "#b0b0b0"); },
  "D": function (R) { floor(R); R(0, 0, 2, 16, "#7a4b2a"); R(14, 0, 2, 16, "#7a4b2a"); R(3, 4, 10, 8, "#a77852"); R(4, 5, 8, 6, "#b98a62"); },
  "E": function (R) { R(0, 0, 16, 16, "#6e6e69"); R(1, 2, 14, 14, "#c9c6bd"); R(7, 2, 2, 14, "#8d8a82"); R(1, 0, 14, 2, "#4a4a46"); R(12, 0, 2, 2, "#7fe0a0"); },
  "L": function (R) { R(0, 0, 16, 16, "#e6bcac"); R(3, 2, 10, 13, "#8a5a33"); R(3, 2, 10, 2, "#a8703f"); R(7, 6, 2, 7, "#e0c080"); R(5, 8, 6, 2, "#e0c080"); },
  // 엘리베이터 두 칸(EE)은 왼쪽 문, 오른쪽 문으로 나눠 그린다. 가운데 틈이 문이 열리는 곳
  "E<": function (R) {
    wall(R); R(1, 0, 15, 16, "#5f6368"); R(3, 1, 13, 2, "#2a2d31"); R(13, 1, 2, 1, "#7fe0a0");
    R(3, 4, 13, 12, "#b9bec4"); R(4, 5, 1, 10, "#e3e7eb"); R(3, 4, 13, 1, "#8d939a"); R(15, 4, 1, 12, "#30343a");
  },
  "E>": function (R) {
    wall(R); R(0, 0, 15, 16, "#5f6368"); R(0, 1, 13, 2, "#2a2d31"); R(1, 2, 2, 1, "#f0b44a");
    R(0, 4, 13, 12, "#b9bec4"); R(11, 5, 1, 10, "#e3e7eb"); R(0, 4, 13, 1, "#8d939a"); R(0, 4, 1, 12, "#30343a");
    R(14, 7, 2, 4, "#3a3d42"); R(14, 8, 1, 1, "#f0c040"); R(14, 9, 1, 1, "#f0c040");
  },
  // 계단: 올라가는 계단은 밝게, 내려가는 계단은 어둡게. 위에 화살표를 따로 얹는다 (drawStairsSign)
  "s": function (R) { R(0, 0, 16, 16, "#bdb6a6"); for (var y = 1; y < 16; y += 3) { R(0, y, 16, 1, "#8c8576"); R(0, y + 1, 16, 1, "#d2ccbe"); } },
  "s^": function (R) { R(0, 0, 16, 16, "#d8d1c1"); for (var y = 0; y < 16; y += 4) { R(0, y, 16, 1, "#f3eee3"); R(0, y + 3, 16, 1, "#a89f8c"); } R(0, 0, 1, 16, "#8c8576"); R(15, 0, 1, 16, "#8c8576"); },
  "sv": function (R) { R(0, 0, 16, 16, "#8a8373"); for (var y = 0; y < 16; y += 4) { R(0, y, 16, 1, "#a69e8c"); R(0, y + 3, 16, 1, "#5e584c"); } R(0, 0, 1, 16, "#4a453c"); R(15, 0, 1, 16, "#4a453c"); },
  " ": function (R) { R(0, 0, 16, 16, "#20242b"); }
};
var SOLID = "#wxbhtckpEL ";
var tileCache = {};
// 이웃 칸에 따라 그림을 고른다 (엘리베이터 왼쪽/오른쪽 문, 계단 위/아래)
function tileKey(m, x, y) {
  var ch = tileAt(m, x, y);
  if (ch === "E") return tileAt(m, x + 1, y) === "E" ? "E<" : tileAt(m, x - 1, y) === "E" ? "E>" : "E";
  if (ch === "s" && m.stairsWay) return m.stairsWay === "up" ? "s^" : "sv";
  return ch;
}
function tileImg(ch) { if (!TILE[ch]) ch = " "; return tileCache[ch] || (tileCache[ch] = paint(TILE[ch])); }

/* ---------- 그림: 악기와 물건 ---------- */
var THING = {
  piano: function (R) { R(1, 3, 14, 9, "#1d1d1f"); R(2, 8, 12, 4, "#f4f1ea"); for (var x = 3; x < 14; x += 2) R(x, 8, 1, 2, "#1d1d1f"); R(3, 12, 1, 3, "#444"); R(12, 12, 1, 3, "#444"); },
  keys: function (R) { R(1, 4, 14, 8, "#b33a3a"); R(2, 8, 12, 3, "#f4f1ea"); for (var x = 3; x < 14; x += 2) R(x, 8, 1, 2, "#1d1d1f"); R(3, 12, 1, 3, "#444"); R(12, 12, 1, 3, "#444"); },
  drums: function (R) { R(4, 6, 8, 8, "#c9c6bd"); R(5, 7, 6, 6, "#e8e4da"); R(1, 3, 5, 3, "#d4a83a"); R(10, 2, 5, 3, "#d4a83a"); R(1, 10, 4, 4, "#b0aca0"); R(11, 10, 4, 4, "#b0aca0"); },
  bass: function (R) { R(7, 0, 2, 9, "#d9c08f"); R(6, 0, 4, 2, "#2f5f9f"); R(4, 8, 8, 7, "#2f5f9f"); R(5, 9, 6, 5, "#4f85c5"); R(7, 11, 2, 1, "#ddd"); },
  eguitar: function (R) { R(7, 0, 2, 9, "#d9c08f"); R(6, 0, 4, 2, "#222"); R(4, 8, 8, 7, "#c0392b"); R(5, 9, 6, 5, "#e74c3c"); R(6, 11, 4, 1, "#eee"); },
  aguitar: function (R) { R(7, 0, 2, 8, "#6b4426"); R(6, 0, 4, 2, "#3a2717"); R(3, 7, 10, 8, "#d2a160"); R(4, 8, 8, 6, "#e3b878"); R(7, 10, 2, 2, "#3a2717"); },
  cafe: function (R) { R(0, 3, 16, 13, "#2f333a"); R(0, 3, 16, 3, "#5b616b"); R(3, 0, 10, 9, "#d7d7d2"); R(4, 1, 8, 2, "#9aa3ad"); R(5, 5, 2, 3, "#333"); R(9, 5, 2, 3, "#333"); R(6, 9, 4, 3, "#f4f1ea"); },
  sign: function (R) { R(3, 3, 10, 9, "#6b4a2b"); R(4, 4, 8, 7, "#f4ead2"); R(5, 6, 6, 1, "#8a7a63"); R(5, 8, 4, 1, "#8a7a63"); }
};
/* ---------- 그림: 가방 아이템 (16x16). items 의 icon 으로 고르고, color 로 겉 색을 바꾼다 ---------- */
var ICON = {
  bible: function (R, g, col) {

var chip = { on: false, gain: null, song: 0, i: 0, start: 0, timer: null, paused: false };
function chipPump() {
  if (!chip.on || !actx) return;
  var until = actx.currentTime + 1;
  for (var guard = 0; guard < 4; guard++) {
    var sg = CHIP[chip.song];
    while (chip.i < sg.ev.length) {
      var e = sg.ev[chip.i], when = chip.start + e.t * sg.spb;
      if (when > until) return;
      if (when > actx.currentTime - 0.05) {
        var len = e.d * sg.spb * 0.88, w = Math.max(when, actx.currentTime);
        if (e.v === 0) beep(e.m, w, len, "pulse", 0.07, chip.gain);                    // 멜로디
        else if (e.v === e.n - 1) beep(e.m, w, len, "triangle", 0.13, chip.gain);      // 베이스
        else if (e.v === 1) beep(e.m, w, len * 0.6, "square", 0.018, chip.gain);       // 화음 하나만 작게
      }
      chip.i++;
    }
    chip.start += (sg.len + 2) * sg.spb; chip.song = (chip.song + 1) % CHIP.length; chip.i = 0;
  }
}
function chipStart() {
  var a = audio(); if (!a || chip.on || !CHIP.length) return;
  chip.on = true; chip.gain = a.createGain(); chip.gain.gain.value = 1; chip.gain.connect(out);
  chip.start = a.currentTime + 0.3; chip.i = 0;
  chipPump(); chip.timer = setInterval(chipPump, 250); soundBtn();
}
function chipStop() {
  if (!chip.on) return;
  chip.on = false; clearInterval(chip.timer);
  var g = chip.gain; g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.08); setTimeout(function () { g.disconnect(); }, 800);
  soundBtn();
}
function chipPause(p) {
  // 투어 창(악기, 카페, 사진)을 여는 동안은 게임 음악을 멈춘다
  if (p) { chip.paused = chip.on; chipStop(); } else if (chip.paused) { chip.paused = false; chipStart(); }
}
function pref(v) { try { if (v === undefined) return localStorage.getItem("tour.gamebgm"); localStorage.setItem("tour.gamebgm", v); } catch (e) { return null; } }
function soundBtn() {
  var b = $("soundBtn");
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>' + (chip.on
    ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    : '<path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>');
  b.setAttribute("aria-label", chip.on ? "음악 끄기" : "음악 켜기");
  b.hidden = !CHIP.length;
}
$("soundBtn").addEventListener("click", function () { if (chip.on) { chipStop(); pref("off"); } else { chipStart(); pref("on"); } });
document.addEventListener("visibilitychange", function () { if (actx) { if (document.hidden) actx.suspend(); else actx.resume(); } });

/* ---------- 시작 ---------- */
document.title = (G.title || "교회 탐험") + (T.church && T.church.name ? " · " + T.church.name : "");
$("tTitle").textContent = G.title || "교회 탐험"; $("tSub").textContent = G.subtitle || "";
var saved = load();
if (saved && saved.st) { st = saved.st; st.found = st.found || {}; st.counts = st.counts || {}; }
if (!st.look) st.look = { hair: HAIRS[0], shirt: SHIRTS[0] };
function drawTitleArt() { var art = $("titleArt").getContext("2d"); art.clearRect(0, 0, 16, 16); art.drawImage(personImg(st.look, "down", 0), 0, 0); }
drawTitleArt();
$("lookBtn").addEventListener("click", function () {
  // 옷 색을 먼저 바꾸고, 한 바퀴 돌면 머리색도 바꾼다
  var si = (SHIRTS.indexOf(st.look.shirt) + 1) % SHIRTS.length, hi = HAIRS.indexOf(st.look.hair);
  if (si === 0) hi = (hi + 1) % HAIRS.length;
  st.look = { hair: HAIRS[Math.max(0, hi)], shirt: SHIRTS[si] }; drawTitleArt(); blip();
});
if (saved && saved.st && (saved.st.q > 0 || saved.st.items.length)) { $("startBtn").textContent = "이어서 하기"; $("newBtn").hidden = false; }
function begin(fresh) {
  if (fresh) { var look = st.look; st = freshState(); st.look = look; }
  if (!fresh && saved && maps[saved.map]) { P.map = saved.map; P.x = saved.x; P.y = saved.y; P.dir = saved.dir || "down"; }
  else { P.map = S0.map; P.x = S0.x; P.y = S0.y; P.dir = S0.dir || "down"; }
  $("title").hidden = true; audio();
  if (pref() !== "off") chipStart(); else soundBtn();
  updateHud(); updateQuest(); updateBag(); save();
  if (fresh || !saved) talk("", G.intro || ["방향 버튼으로 걸어 다니고, 사람이나 물건 앞에서 A 를 눌러 보세요."], null);
}
$("startBtn").addEventListener("click", function () { begin(false); });
$("newBtn").addEventListener("click", function () { begin(true); });
soundBtn(); resize(); updateHud(); updateQuest(); updateBag();
requestAnimationFrame(frame);
if (location.hash === "#debug") window.GAME = { P: P, st: function () { return st; }, busy: busy, others: function () { return others; }, net: net };   // 자동 시험용
})();
</script>
